name: CI

on:
  pull_request:
  push:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: mkk_nebus_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d mkk_nebus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src
      - run: uv run ruff format --check src
      - run: uv run mypy src
      - run: uv run pytest
