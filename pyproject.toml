[project]
name = "mkk-nebus-test"
version = "0.1.0"
description = "Asynchronous payment processing service"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.118,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0.43,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.16.4,<2",
    "pydantic>=2.11.7,<3",
    "pydantic-settings>=2.7.1,<3",
    "faststream[cli,rabbit]==0.7.7",
    "httpx2==2.13.1",
]

[dependency-groups]
dev = [
    "ruff>=0.13.2,<1",
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=1.2,<2",
    "pytest-cov>=7,<8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["*.tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]
asyncio_mode = "auto"
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/tests/*", "*/tests/*", "src/alembic/*", "src/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
